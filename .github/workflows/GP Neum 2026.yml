<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velika nagrada Neuma 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#131A22; --muted:#56616E; --line:#CBD3DC;
  --signal:#D11A24; --signal-soft:rgba(209,26,36,.12);
  --skoda:#118A4C; --hyundai:#1E63B8; --audi:#5E6772;
  --bulb-off:#2A2F36; --track:#B9C2CC;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151C; --surface:#17202A; --surface-2:#1C2733; --ink:#EEF2F6; --muted:#97A3B1; --line:#2A3644;
    --signal:#F0313A; --signal-soft:rgba(240,49,58,.16);
    --skoda:#3CC27A; --hyundai:#5AA3F0; --audi:#C3CAD3;
    --bulb-off:#222A33; --track:#34414F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#17202A; --surface-2:#1C2733; --ink:#EEF2F6; --muted:#97A3B1; --line:#2A3644;
  --signal:#F0313A; --signal-soft:rgba(240,49,58,.16);
  --skoda:#3CC27A; --hyundai:#5AA3F0; --audi:#C3CAD3;
  --bulb-off:#222A33; --track:#34414F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:24px;height:56px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{display:block;width:22px;height:12px;background:var(--signal);transform:skewX(-20deg)}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a.l{display:block;padding:8px 10px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);text-decoration:none;white-space:nowrap;border-radius:4px}
.nav a.l:hover{color:var(--ink);background:var(--surface-2)}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
section{padding:72px 0;border-bottom:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:4px 20px;align-items:end;margin-bottom:36px}
.sec-head .tag{grid-row:span 2;font-family:var(--display);font-weight:900;font-size:64px;line-height:.8;color:var(--signal);transform:skewX(-12deg)}
h2{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,52px);line-height:1;margin:0;letter-spacing:-.01em}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* hero */
.hero{padding:56px 0 64px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-8%;top:0;bottom:0;width:46%;background:repeating-linear-gradient(-68deg,transparent 0 22px,var(--line) 22px 24px);opacity:.55;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.hero-in{position:relative;z-index:1}
.event{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);margin:0 0 18px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(56px,11vw,148px);line-height:.86;margin:0;letter-spacing:-.02em;transform:skewX(-8deg);transform-origin:left bottom}
.hero h1 span{display:block}
.route-line{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.6vw,28px);margin:22px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.route-line b{width:28px;height:3px;background:var(--signal);display:inline-block}

.lights-box{margin-top:44px;display:flex;flex-wrap:wrap;align-items:center;gap:28px}
.lights{display:flex;gap:10px;padding:14px 16px;background:#0B0E12;border-radius:10px}
.light{display:flex;flex-direction:column;gap:8px;padding:8px;background:#1A1F26;border-radius:8px}
.bulb{width:30px;height:30px;border-radius:50%;background:var(--bulb-off);transition:background .08s,box-shadow .08s}
.light.on .bulb.r{background:#F0242E;box-shadow:0 0 18px 2px rgba(240,36,46,.75)}
.lights-msg{min-height:84px;display:flex;flex-direction:column;justify-content:center}
.lights-msg .small{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);margin:0}
.lights-msg .big{font-family:var(--display);font-weight:900;font-size:clamp(36px,5vw,56px);line-height:1;margin:0;opacity:0;transform:translateX(-12px);transition:opacity .35s,transform .35s}
.lights-msg.go .big{opacity:1;transform:none}
.replay{font-family:var(--display);font-weight:600;font-size:16px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
.replay:hover{border-color:var(--ink)}

.strip{margin-top:48px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.strip div{padding:16px 18px;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0}
.strip dt{font-size:14px;color:var(--muted)}
.strip dd{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.strip .hot dd{color:var(--signal)}

/* teams */
.grid-teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.team-bar{height:6px;background:var(--team)}
.team-top{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 0}
.team-top .pos{font-family:var(--display);font-weight:900;font-size:88px;line-height:.78;color:var(--team);transform:skewX(-10deg);opacity:.95}
.team-top .car{text-align:right}
.team-top h3{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0}
.team-top .car p{margin:4px 0 0;color:var(--muted);font-size:14px}
.role{margin:16px 20px 0;display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:16px;padding:4px 12px;border-radius:4px;background:color-mix(in srgb,var(--team) 14%,transparent);color:var(--ink)}
.role::before{content:"";width:10px;height:10px;background:var(--team);transform:skewX(-20deg)}
.driver{display:flex;gap:16px;align-items:center;padding:20px}
.avatar{position:relative;flex:none;width:112px;height:112px;border-radius:50%;padding:0;border:3px solid var(--team);background:var(--surface-2);cursor:pointer;overflow:hidden;color:var(--team)}
.avatar.sm{width:58px;height:58px;border-width:2px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:100%;height:100%;display:block}
.avatar .plus{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 18px/26px var(--body);text-align:center}
.avatar.sm .plus{width:18px;height:18px;font-size:13px;line-height:18px;right:2px;bottom:2px}
.avatar.has .plus{display:none}
.avatar:hover{filter:brightness(1.05)}
.who .lbl{font-size:13px;color:var(--muted);margin:0}
.name{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;margin:2px 0 0;text-transform:uppercase;outline:none;border-bottom:1px dashed transparent;min-width:4ch;display:inline-block}
.name:hover,.name:focus{border-bottom-color:var(--muted)}
.pname{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;outline:none;border-bottom:1px dashed transparent;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.pname:hover,.pname:focus{border-bottom-color:var(--muted)}
.crew{padding:0 20px 20px;display:flex;flex-wrap:wrap;gap:14px}
.crew .p{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px;text-align:center}
.team-stats{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.team-stats div{padding:12px 20px}
.team-stats div+div{border-left:1px solid var(--line)}
.team-stats dt{font-size:13px;color:var(--muted)}
.team-stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2}
.hint{margin:20px 0 0;color:var(--muted);font-size:14px}

/* podium */
.edit-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:-12px 0 28px}
.edit-bar[hidden]{display:none}
.edit-btn{font-family:var(--display);font-weight:700;font-size:17px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:6px;padding:8px 16px;cursor:pointer}
.edit-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.edit-status{font-size:14px;color:var(--muted)}
.edit-status.err{color:var(--signal)}
.podium{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.14fr) minmax(0,1fr);gap:20px;align-items:end;padding-top:12px}
.pcol{display:flex;flex-direction:column;min-width:0}
.pcard{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;overflow:hidden;display:flex;flex-direction:column}
.p1 .pcard{border-color:var(--team);border-width:2px 2px 0}
.slot{position:relative;display:block;padding:0;border:0;margin:0;background:none;color:var(--team);overflow:hidden;font:inherit}
.slot:disabled{cursor:default}
.slot img{display:block;width:100%;height:100%;object-fit:cover}
.slot svg{display:block;width:100%;height:100%}
.cue{position:absolute;inset:auto 8px 8px auto;font-family:var(--display);font-weight:700;font-size:14px;line-height:1;padding:6px 10px;border-radius:4px;background:var(--ink);color:var(--bg);display:none;white-space:nowrap}
.editing .slot:not(:disabled){cursor:pointer;outline:2px dashed var(--team);outline-offset:-2px}
.editing .slot:not(:disabled) .cue{display:block}
.slot.busy::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.6}
.car-shot{width:100%;aspect-ratio:16/10;background:linear-gradient(180deg,color-mix(in srgb,var(--team) 14%,var(--surface)) 0%,var(--surface-2) 100%)}
.p1 .car-shot{aspect-ratio:16/11}
.pdriver{display:flex;gap:14px;align-items:flex-end;padding:0 18px;margin-top:-46px;position:relative;z-index:1}
.dphoto{flex:none;width:96px;height:96px;border-radius:50%;background:var(--surface-2);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--team)}
.p1 .dphoto{width:124px;height:124px}
.dphoto .cue,.cphoto .cue{inset:auto 50% 6px auto;transform:translateX(50%);font-size:12px;padding:4px 7px}
.pmeta{min-width:0;padding-bottom:4px}
.pmeta .lbl{font-size:13px;color:var(--muted);margin:0}
.dname{font-family:var(--display);font-weight:900;font-size:clamp(26px,3vw,36px);line-height:1;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;outline:none}
.p1 .dname{font-size:clamp(30px,3.6vw,44px)}
.carname{margin:4px 0 0;font-size:14px;color:var(--muted)}
.pcard .role{margin:16px 18px 0}
.crew{padding:16px 18px 20px;display:flex;flex-wrap:wrap;gap:14px}
.crew .p{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;text-align:center}
.cphoto{width:58px;height:58px;border-radius:50%;background:var(--surface-2);box-shadow:0 0 0 2px var(--team)}
.pname{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;overflow-wrap:anywhere;outline:none}
.editing [data-name]{border-bottom:1px dashed var(--muted);cursor:text}
.step{background:var(--surface-2);border:1px solid var(--line);border-top:6px solid var(--team);border-radius:0 0 10px 10px;display:flex;align-items:center;justify-content:center;gap:14px}
.step b{font-family:var(--display);font-weight:900;font-size:64px;line-height:1;color:var(--team);transform:skewX(-10deg)}
.step span{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15;color:var(--muted)}
.p1 .step{height:150px}.p2 .step{height:104px}.p3 .step{height:72px}
.p1 .step b{font-size:96px}
.p3 .step b{font-size:48px}
@media (max-width:960px){
  .podium{grid-template-columns:1fr;gap:28px}
  .p1{order:1}.p2{order:2}.p3{order:3}
  .p1 .step,.p2 .step,.p3 .step{height:64px}
  .p1 .step b,.step b{font-size:44px}
}
/* map */
.map-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.map svg{display:block;width:100%;min-width:520px;height:auto}
.plan-switch{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface);margin-bottom:18px}
.plan-switch button{font-family:var(--display);font-weight:700;font-size:17px;border:0;background:none;color:var(--muted);padding:8px 16px;border-radius:5px;cursor:pointer}
.plan-switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.r-path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s,opacity .25s}
.r-base{stroke:var(--track);stroke-width:14}
.r-main{stroke:var(--ink);stroke-width:4}
.r-alt{stroke:var(--muted);stroke-width:3;stroke-dasharray:8 8;opacity:.6}
.r-alt.active{stroke:var(--signal);stroke-dasharray:none;stroke-width:4;opacity:1}
.r-a.active{stroke:var(--signal)}
.r-a.dim{stroke:var(--muted);stroke-dasharray:8 8;opacity:.6;stroke-width:3}
.stop circle{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.stop.key circle{fill:var(--signal);stroke:var(--signal)}
.stop text{font-family:var(--display);font-weight:700;font-size:18px;fill:var(--ink)}
.stop text.sub{font-family:var(--body);font-weight:400;font-size:12.5px;fill:var(--muted)}
.stop.b{opacity:.5;transition:opacity .25s}
.stop.b.on{opacity:1}
.sectors{display:flex;flex-direction:column;gap:12px}
.sector{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:baseline}
.sector .s{font-family:var(--display);font-weight:900;font-size:22px;color:var(--signal)}
.sector h3{margin:0;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15}
.sector .km{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap}
.sector p{grid-column:2/4;margin:0;color:var(--muted);font-size:14px}
.sector[hidden]{display:none}

/* schedule */
.sched{list-style:none;margin:0;padding:0;border-left:3px solid var(--line);margin-left:8px}
.sched li{position:relative;display:grid;grid-template-columns:110px 1fr;gap:4px 24px;padding:14px 0 14px 28px}
.sched li::before{content:"";position:absolute;left:-9px;top:24px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:3px solid var(--muted)}
.sched li.key::before{background:var(--signal);border-color:var(--signal)}
.sched time{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.sched h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2}
.sched p{margin:2px 0 0;color:var(--muted);max-width:60ch}
.sched li.key h3{color:var(--signal)}
.note{margin:28px 0 0;padding:16px 20px;border-left:4px solid var(--signal);background:var(--signal-soft);border-radius:0 8px 8px 0;max-width:80ch}

/* restaurants */
.rest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px}
.rcard.top{border:2px solid var(--signal)}
.rcard .badge{align-self:flex-start;font-family:var(--display);font-weight:700;font-size:15px;background:var(--signal);color:#fff;padding:3px 10px;border-radius:4px}
.rcard h3{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05}
.rcard .where{margin:0;color:var(--muted);font-size:14px}
.rcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.rcard dt{font-family:var(--display);font-weight:700}
.rcard dd{margin:0}
.facts{margin-top:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2}

/* rules */
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.rule-col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.rule-col h3{margin:0 0 12px;font-family:var(--display);font-weight:800;font-size:26px}
.rule-col ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.rule-col li::marker{font-family:var(--display);font-weight:800;color:var(--signal)}
.golden{margin:0 0 24px;padding:22px 24px;border-radius:12px;background:var(--ink);color:var(--bg);display:flex;gap:18px;align-items:center}
.golden strong{font-family:var(--display);font-weight:900;font-size:52px;line-height:.9;color:var(--signal);transform:skewX(-10deg)}
.golden p{margin:0;font-size:17px;max-width:70ch}
.speed{margin-top:20px;display:flex;flex-wrap:wrap;gap:14px}
.sign{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px 10px 10px}
.sign b{width:52px;height:52px;border-radius:50%;border:6px solid #D11A24;background:#fff;color:#111;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.sign span{font-size:14px;color:var(--muted);line-height:1.3}

/* checklist */
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.cgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.cgroup h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cgroup h3 small{font-weight:700;font-size:18px;color:var(--muted)}
.meter{height:6px;background:var(--surface-2);border-radius:3px;margin:12px 0 16px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--signal);transition:width .25s}
.cgroup label{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.cgroup input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--signal);flex:none}
.cgroup label:has(input:checked) span{color:var(--muted);text-decoration:line-through}
.reset{margin-top:20px;font-family:var(--display);font-weight:600;font-size:16px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}

/* contacts */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--display);font-weight:700;font-size:17px;background:var(--surface-2)}
td.n{font-family:var(--display);font-weight:800;font-size:24px;white-space:nowrap}
.planb{margin-top:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.planb div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.planb h3{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:20px}
.planb p{margin:0;color:var(--muted)}

footer{padding:40px 0 56px;color:var(--muted);font-size:14px}
footer .flag{height:14px;margin-bottom:20px;background:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/14px 14px;opacity:.85;border-radius:2px}

@media (max-width:960px){
  .grid-teams,.rules,.checks{grid-template-columns:1fr}
  .map-grid{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip div{border-left:0;border-top:1px solid var(--line)}
  .strip div:nth-child(-n+2){border-top:0}
  .strip div:nth-child(even){border-left:1px solid var(--line)}
  .strip div:last-child{grid-column:span 2;border-left:0}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  section{padding:52px 0}
  .rest,.planb{grid-template-columns:1fr}
  .sec-head .tag{font-size:44px}
  .sched li{grid-template-columns:1fr;padding-left:22px}
  .sched time{font-size:28px}
  .bulb{width:22px;height:22px}
  .golden{flex-direction:column;align-items:flex-start}
  .avatar{width:92px;height:92px}
}
@media (prefers-reduced-motion:reduce){
  .bulb,.lights-msg .big,.r-path,.meter i{transition:none}
}
</style>
</head>
<body>

