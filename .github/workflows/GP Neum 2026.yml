<header class="hero" id="start">
  <div class="wrap hero-in">
    <p class="event">Nedjelja, 18. 10. 2026. &nbsp;/&nbsp; 3 tima, 10 putnika, 1 cilj</p>
    <h1><span>Velika nagrada</span><span>Neuma</span></h1>
    <p class="route-line">Sarajevo <b aria-hidden="true"></b> Konjic <b aria-hidden="true"></b> Blagaj <b aria-hidden="true"></b> Stolac <b aria-hidden="true"></b> Neum</p>

    <div class="lights-box">
      <div class="lights" aria-hidden="true" id="lights">
        <div class="light"><span class="bulb"></span><span class="bulb r"></span></div>
        <div class="light"><span class="bulb"></span><span class="bulb r"></span></div>
        <div class="light"><span class="bulb"></span><span class="bulb r"></span></div>
        <div class="light"><span class="bulb"></span><span class="bulb r"></span></div>
        <div class="light"><span class="bulb"></span><span class="bulb r"></span></div>
      </div>
      <div class="lights-msg" id="lightsMsg" aria-live="polite">
        <p class="small">Svjetla se gase u</p>
        <p class="big">09:25, INA Konjic</p>
      </div>
      <button class="replay" id="replay" type="button">Ponovi start</button>
    </div>

    <dl class="strip">
      <div><dt>Polazak od kuće</dt><dd>08:10</dd></div>
      <div><dt>Okupljanje, INA Konjic</dt><dd>09:10</dd></div>
      <div class="hot"><dt>Start kolone</dt><dd>09:25</dd></div>
      <div><dt>Doručak, Blagaj</dt><dd>10:40</dd></div>
      <div class="hot"><dt>Cilj, Neum</dt><dd>13:15</dd></div>
    </dl>
  </div>
</header>

<main>
<section id="timovi">
  <div class="wrap">
    <div class="sec-head">
      <span class="tag" aria-hidden="true">P1–P3</span>
      <h2>Startna postava</h2>
      <p>Octavia startuje s prve pozicije i vodi kolonu, Elantra vozi druga, a Audi treći zatvara kolonu.</p>
    </div>
    <div class="edit-bar" id="editBar" hidden>
      <button class="edit-btn" id="editToggle" type="button" aria-pressed="false">Uredi slike i imena</button>
      <span class="edit-status" id="editStatus" role="status"></span>
    </div>

    <div class="podium" id="podium">
      <article class="pcol p2" style="--team:var(--hyundai)" aria-label="Pozicija 2: Hyundai Elantra">
        <div class="pcard">
          <button class="slot car-shot" type="button" data-slot="ela-car" data-kind="car" data-alt="Hyundai Elantra 2021" disabled></button>
          <div class="pdriver">
            <button class="slot dphoto" type="button" data-slot="ela-d" data-kind="face" data-alt="Vozač Elantre" disabled></button>
            <div class="pmeta"><p class="lbl">Vozač</p><h3 class="dname" data-name="ela-d">Hamza</h3><p class="carname">Hyundai Elantra 2021</p></div>
          </div>
          <span class="role">Sredina kolone</span>
          <div class="crew">
            <div class="p"><button class="slot cphoto" type="button" data-slot="ela-p1" data-kind="face" data-alt="Putnik" disabled></button><span class="pname" data-name="ela-p1">Ademir</span></div>
            <div class="p"><button class="slot cphoto" type="button" data-slot="ela-p2" data-kind="face" data-alt="Putnica" disabled></button><span class="pname" data-name="ela-p2">Adna</span></div>
            <div class="p"><button class="slot cphoto" type="button" data-slot="ela-p3" data-kind="face" data-alt="Putnica" disabled></button><span class="pname" data-name="ela-p3">Nedžla</span></div>
          </div>
        </div>
        <div class="step"><b>2</b><span>4 osobe<br>drži razmak</span></div>
      </article>

      <article class="pcol p1" style="--team:var(--skoda)" aria-label="Pozicija 1: Škoda Octavia">
        <div class="pcard">
          <button class="slot car-shot" type="button" data-slot="oct-car" data-kind="car" data-alt="Škoda Octavia 2014" disabled></button>
          <div class="pdriver">
            <button class="slot dphoto" type="button" data-slot="oct-d" data-kind="face" data-alt="Vozač Octavije" disabled></button>
            <div class="pmeta"><p class="lbl">Vozač</p><h3 class="dname" data-name="oct-d">Samir</h3><p class="carname">Škoda Octavia 2014</p></div>
          </div>
          <span class="role">Vodeće vozilo</span>
          <div class="crew">
            <div class="p"><button class="slot cphoto" type="button" data-slot="oct-p1" data-kind="face" data-alt="Putnik" disabled></button><span class="pname" data-name="oct-p1">Adin</span></div>
            <div class="p"><button class="slot cphoto" type="button" data-slot="oct-p2" data-kind="face" data-alt="Putnik" disabled></button><span class="pname" data-name="oct-p2">Emrah</span></div>
            <div class="p"><button class="slot cphoto" type="button" data-slot="oct-p3" data-kind="face" data-alt="Putnik" disabled></button><span class="pname" data-name="oct-p3">Dino</span></div>
          </div>
        </div>
        <div class="step"><b>1</b><span>4 osobe<br>navigacija i tempo</span></div>
      </article>

      <article class="pcol p3" style="--team:var(--audi)" aria-label="Pozicija 3: Audi A4">
        <div class="pcard">
          <button class="slot car-shot" type="button" data-slot="aud-car" data-kind="car" data-alt="Audi A4 2012" disabled></button>
          <div class="pdriver">
            <button class="slot dphoto" type="button" data-slot="aud-d" data-kind="face" data-alt="Vozač Audija" disabled></button>
            <div class="pmeta"><p class="lbl">Vozač</p><h3 class="dname" data-name="aud-d">Belmin</h3><p class="carname">Audi A4 2012</p></div>
          </div>
          <span class="role">Zatvarač kolone</span>
          <div class="crew">
            <div class="p"><button class="slot cphoto" type="button" data-slot="aud-p1" data-kind="face" data-alt="Putnica" disabled></button><span class="pname" data-name="aud-p1">Ema</span></div>
          </div>
        </div>
        <div class="step"><b>3</b><span>2 osobe<br>javlja zaostajanje</span></div>
      </article>
    </div>
    <p class="hint" id="teamHint">Slike vozača, putnika i auta dodaje organizator.</p>
  </div>
</section>
<section id="staza">
  <div class="wrap">
    <div class="sec-head">
      <span class="tag" aria-hidden="true">S1–S3</span>
      <h2>Staza</h2>
      <p>Plan A ide bez granice, preko Blagaja i Stoca. Plan B ide preko Čapljine i prijelaza Doljani / Metković. Udaljenosti su približne.</p>
    </div>

    <div class="plan-switch" role="group" aria-label="Izbor rute">
      <button type="button" data-plan="a" aria-pressed="true">Plan A: bez granice</button>
      <button type="button" data-plan="b" aria-pressed="false">Plan B: preko granice</button>
    </div>

    <div class="map-grid">
      <div class="map">
        <svg viewBox="0 0 800 540" role="img" aria-labelledby="mapTitle">
          <title id="mapTitle">Shematska mapa rute od Sarajeva do Neuma</title>
          <path class="r-path r-base" d="M690 70 C640 90 600 110 570 135 S505 175 480 195 C440 225 400 240 370 270 C360 285 375 300 395 312 C430 335 470 360 490 405 C500 440 420 470 330 480 C290 486 265 488 250 492"/>
          <path class="r-path r-base" d="M395 312 C360 330 320 345 300 370 C280 395 240 410 210 425 C205 450 230 475 250 492" style="stroke-width:10;opacity:.6"/>
          <path class="r-path r-main" d="M690 70 C640 90 600 110 570 135 S505 175 480 195 C440 225 400 240 370 270 C360 285 375 300 395 312"/>
          <path class="r-path r-main r-a active" id="routeA" d="M395 312 C430 335 470 360 490 405 C500 440 420 470 330 480 C290 486 265 488 250 492"/>
          <path class="r-path r-alt" id="routeB" d="M395 312 C360 330 320 345 300 370 C280 395 240 410 210 425 C205 450 230 475 250 492"/>

          <g class="stop key"><circle cx="690" cy="70" r="10"/><text x="710" y="66">Sarajevo</text><text class="sub" x="710" y="84">Od kuće 08:10</text></g>
          <g class="stop key"><circle cx="570" cy="135" r="10"/><text x="590" y="132">INA Konjic</text><text class="sub" x="590" y="149">Okupljanje i kafa 09:10</text></g>
          <g class="stop"><circle cx="480" cy="195" r="7"/><text x="500" y="192">Jablanica</text><text class="sub" x="500" y="209">Bez zaustavljanja</text></g>
          <g class="stop"><circle cx="370" cy="270" r="8"/><text x="248" y="266">Mostar</text><text class="sub" x="248" y="283">Prolaz prema Buni</text></g>
          <g class="stop key"><circle cx="395" cy="312" r="10"/><text x="420" y="306">Blagaj</text><text class="sub" x="420" y="323">Doručak 10:40–11:45</text></g>
          <g class="stop" id="stopStolac"><circle cx="490" cy="405" r="8"/><text x="512" y="402">Stolac</text><text class="sub" x="512" y="419">Plan A</text></g>
          <g class="stop b" id="stopCap"><circle cx="300" cy="370" r="8"/><text x="170" y="366">Čapljina</text><text class="sub" x="170" y="383">Plan B</text></g>
          <g class="stop b" id="stopGr"><circle cx="210" cy="425" r="8"/><text x="40" y="421">Doljani / Metković</text><text class="sub" x="40" y="438">Granica, pa Klek</text></g>
          <g class="stop key"><circle cx="250" cy="492" r="11"/><text x="272" y="512">Neum</text><text class="sub" x="330" y="512">Cilj 13:15</text></g>
        </svg>
      </div>

      <div class="sectors">
        <div class="sector"><span class="s">S1</span><h3>Kuća – INA Konjic</h3><span class="km">≈ 60 km</span><p>Svako vozilo vozi samostalno, preko Tarčina (A1 / M17). Okupljanje i kafa na INA Konjic u 09:10. <a href="https://www.google.com/maps/search/?api=1&amp;query=43.6905925,17.985485" target="_blank" rel="noopener">Otvori u Google Maps</a></p></div>
        <div class="sector"><span class="s">S2</span><h3>INA Konjic – Blagaj</h3><span class="km">≈ 92 km</span><p>Kolona kroz Jablanicu i Mostar do Blagaja, bez zaustavljanja. Doručak od 10:40 do 11:45.</p></div>
        <div class="sector" data-sector="a"><span class="s">S3</span><h3>Blagaj – Stolac – Neum</h3><span class="km">≈ 75 km</span><p>Plan A, bez granice. Oko 1 h 30 min vožnje.</p></div>
        <div class="sector" data-sector="b" hidden><span class="s">S3</span><h3>Blagaj – Čapljina – Neum</h3><span class="km">≈ 70 km</span><p>Plan B, dva granična prijelaza: Doljani / Metković i Klek / Neum. Dokumenti spremni u ruci.</p></div>
        <div class="sector"><span class="s">Σ</span><h3>Ukupno</h3><span class="km">≈ 225 km</span><p>Oko 3 h 30 min čiste vožnje. Na dan puta uporedite obje rute u Google Maps ili Waze prije polaska iz Blagaja.</p></div>
      </div>
    </div>
  </div>
</section>

<section id="raspored">
  <div class="wrap">
    <div class="sec-head">
      <span class="tag" aria-hidden="true">T</span>
      <h2>Raspored utrke</h2>
      <p>Dolazak u Neum je planiran za 13:15. Svako vozilo samostalno dolazi do INA Konjic, odakle kreće kolona.</p>
    </div>
    <ol class="sched">
      <li><time>08:10</time><div><h3>Polazak od kuće</h3><p>Svako vozilo kreće samostalno sa svog mjesta dogovora, iz Sarajeva najkasnije u 08:10. Ko kreće iz udaljenijeg dijela grada, kreće ranije.</p></div></li>
      <li class="key"><time>09:10</time><div><h3>Okupljanje i kafa: INA Konjic</h3><p>Sva tri auta na benzinskoj pumpi INA Konjic. <a href="https://www.google.com/maps/search/?api=1&amp;query=43.6905925,17.985485" target="_blank" rel="noopener">Otvori lokaciju u Google Maps</a></p></div></li>
      <li><time>09:20</time><div><h3>Brifing vozača</h3><p>5 minuta: prozivka svih 10 osoba, ruta, kontakti i Viber grupa „Kolona Neum“.</p></div></li>
      <li class="key"><time>09:25</time><div><h3>Start kolone</h3><p>Octavia – Elantra – Audi, kroz Jablanicu i Mostar, bez zaustavljanja.</p></div></li>
      <li><time>10:35</time><div><h3>Dolazak u Blagaj</h3><p>Parkiranje na mjestu dogovorenom s restoranom.</p></div></li>
      <li class="key"><time>10:40</time><div><h3>Doručak</h3><p>10 osoba, narudžba poslata dan ranije. Račun plaćen do 11:40.</p></div></li>
      <li><time>11:45</time><div><h3>Polazak prema Neumu</h3><p>Prozivka, pa plan A: Blagaj – Stolac – Neum, oko 1 h 30 min.</p></div></li>
      <li class="key"><time>13:15</time><div><h3>Cilj: Neum</h3><p>Dolazak na smještaj. Adresa: upisati.</p></div></li>
    </ol>
    <p class="note">Satnica nema dodatne rezerve, pa doručak traje tačno do 11:40. Ako neko vozilo kasni na okupljanje, javlja u grupu; kolona čeka najviše 10 minuta, a kafa se tada pije usput. Plan B kreće iz Blagaja u isto vrijeme i bira se samo ako je cesta Stolac – Neum zatvorena ili spora.</p>
  </div>
</section>

<section id="dorucak">
  <div class="wrap">
    <div class="sec-head">
      <span class="tag" aria-hidden="true">PIT</span>
      <h2>Pit stop: doručak</h2>
      <p>Preporuka je Blagaj uz vrelo Bune: lijepo je i leži tačno na ruti plana A. Prijedlozi nisu provjereni na internetu, pa radno vrijeme i rezervaciju za 10 osoba potvrdite telefonom.</p>
    </div>
    <div class="rest">
      <article class="rcard top">
        <span class="badge">Preporuka</span>
        <h3>Restorani uz vrelo Bune</h3>
        <p class="where">Blagaj, ispod Tekije, oko 12 km od centra Mostara (npr. Restoran Vrelo)</p>
        <dl><dt>Plus</dt><dd>Najljepši ambijent, uz rijeku, direktno na ruti plana A</dd><dt>Minus</dt><dd>Provjeriti radno vrijeme; par minuta hoda od parkinga</dd></dl>
      </article>
      <article class="rcard">
        <h3>Hotel Mepas</h3>
        <p class="where">Mostar sjever, pri ulasku iz Sarajeva</p>
        <dl><dt>Plus</dt><dd>Veliki parking, pouzdan hotelski doručak za grupu</dd><dt>Minus</dt><dd>Manje šarma, moderni ambijent</dd></dl>
      </article>
      <article class="rcard">
        <h3>Hotel Bristol</h3>
        <p class="where">Uz Neretvu, blizu centra</p>
        <dl><dt>Plus</dt><dd>Pogled na rijeku, blizu Starog grada</dd><dt>Minus</dt><dd>Ograničen parking, sporiji izlaz prema Blagaju</dd></dl>
      </article>
      <article class="rcard">
        <h3>Restoran Šadrvan</h3>
        <p class="where">Stari grad, kod Starog mosta</p>
        <dl><dt>Plus</dt><dd>Tipična mostarska atmosfera</dd><dt>Minus</dt><dd>Parking i pješačenje oduzimaju 15–20 min; nije sigurno da služe doručak u to doba</dd></dl>
      </article>
    </div>
    <dl class="facts">
      <div><dt>Rezervacija</dt><dd>10 osoba, 10:35</dd></div>
      <div><dt>Trajanje</dt><dd>65 minuta</dd></div>
      <div><dt>Okvirni budžet</dt><dd>15–25 KM po osobi</dd></div>
      <div><dt>Ukupno (procjena)</dt><dd>150–250 KM</dd></div>
    </dl>
  </div>
</section>

<section id="pravila">
  <div class="wrap">
    <div class="sec-head">
      <span class="tag" aria-hidden="true">FIA</span>
      <h2>Sportski pravilnik</h2>
      <p>Za razliku od prave Formule 1, ovdje pobjeđuje kolona koja stigne zajedno i bez kazni.</p>
    </div>
    <div class="golden">
      <strong>0,0 ‰</strong>
      <p>Vozači ne piju nimalo alkohola cijeli dan, a niko ne vozi iznad ograničenja da bi sustigao kolonu.</p>
    </div>
    <div class="rules">
      <div class="rule-col">
        <h3>U vožnji</h3>
        <ol>
          <li>Svi vezani, i na zadnjim sjedištima.</li>
          <li>Vozač ne dira mobitel; poruke i navigaciju vodi suvozač.</li>
          <li>Kratka svjetla upaljena cijelo vrijeme.</li>
          <li>Poštuju se sva ograničenja brzine.</li>
        </ol>
      </div>
      <div class="rule-col">
        <h3>U koloni</h3>
        <ol>
          <li>Redoslijed je stalan: Octavia – Elantra – Audi.</li>
          <li>Niko ne pretiče vozilo iz kolone.</li>
          <li>Razmak najmanje 2 sekunde, kroz kanjon Neretve više.</li>
          <li>Ako se kolona razdvoji, Octavia usporava ili čeka na prvom sigurnom mjestu.</li>
          <li>Audi odmah javlja u grupu ako stane ili zaostane.</li>
        </ol>
      </div>
      <div class="rule-col">
        <h3>Pauze i doručak</h3>
        <ol>
          <li>Vrijeme polaska je vrijeme kada auta kreću, ne kada se počinje skupljati.</li>
          <li>Prije svakog polaska vozač prebroji putnike i javi „kompletno“.</li>
          <li>U restoranu kulturno i umjereno glasno; račun do 11:40.</li>
          <li>Smeće se baca na pumpi, ne kroz prozor.</li>
          <li>Na granici (plan B): tiho, dokumenti u ruci, bez snimanja.</li>
        </ol>
      </div>
    </div>
    <div class="speed" aria-label="Ograničenja brzine">
      <div class="sign"><b>50</b><span>Naselje<br>BiH i Hrvatska</span></div>
      <div class="sign"><b>80</b><span>Van naselja<br>BiH</span></div>
      <div class="sign"><b>90</b><span>Van naselja<br>Hrvatska</span></div>
      <div class="sign"><b>100</b><span>Brza cesta<br>BiH</span></div>
      <div class="sign"><b>130</b><span>Autoput<br>BiH</span></div>
    </div>
  </div>
</section>

<section id="pregled">
  <div class="wrap">
    <div class="sec-head">
      <span class="tag" aria-hidden="true">✓</span>
      <h2>Tehnički pregled</h2>
      <p>Svaki vozač prođe listu dan prije puta i javi u grupu da je auto spreman. Kvačice se čuvaju u ovom pregledniku.</p>
    </div>
    <div class="checks" id="checks">
      <div class="cgroup" data-group="v">
        <h3>Vozilo <small data-count></small></h3><div class="meter"><i></i></div>
        <label><input type="checkbox" data-key="v1"><span>Rezervoar barem do pola</span></label>
        <label><input type="checkbox" data-key="v2"><span>Pritisak u gumama za puno opterećenje</span></label>
        <label><input type="checkbox" data-key="v3"><span>Ulje, rashladna tečnost, tečnost za brisače</span></label>
        <label><input type="checkbox" data-key="v4"><span>Svjetla i žmigavci rade</span></label>
        <label><input type="checkbox" data-key="v5"><span>Rezervni točak, dizalica i ključ</span></label>
        <label><input type="checkbox" data-key="v6"><span>Prva pomoć, trokut, prsluk, rezervne sijalice</span></label>
        <label><input type="checkbox" data-key="v7"><span>Audi i Octavia: akumulator i kočnice</span></label>
      </div>
      <div class="cgroup" data-group="d">
        <h3>Dokumenti <small data-count></small></h3><div class="meter"><i></i></div>
        <label><input type="checkbox" data-key="d1"><span>Lična karta ili pasoš za svih 10 osoba (obavezno za plan B)</span></label>
        <label><input type="checkbox" data-key="d2"><span>Vozačka i saobraćajna dozvola</span></label>
        <label><input type="checkbox" data-key="d3"><span>Polica osiguranja i zeleni karton (plan B)</span></label>
        <label><input type="checkbox" data-key="d4"><span>Ovlaštenje vlasnika, ako vozač nije vlasnik</span></label>
      </div>
      <div class="cgroup" data-group="l">
        <h3>Lično <small data-count></small></h3><div class="meter"><i></i></div>
        <label><input type="checkbox" data-key="l1"><span>Napunjen mobitel i punjač za auto</span></label>
        <label><input type="checkbox" data-key="l2"><span>Voda i grickalice</span></label>
        <label><input type="checkbox" data-key="l3"><span>Gotovina u KM za doručak i parking</span></label>
        <label><input type="checkbox" data-key="l4"><span>Lijekovi, sunčane naočale, jakna</span></label>
      </div>
    </div>
    <button class="reset" type="button" id="resetChecks">Poništi kvačice</button>
  </div>
</section>

<section id="kontakti">
  <div class="wrap">
    <div class="sec-head">
      <span class="tag" aria-hidden="true">RC</span>
      <h2>Kontrola utrke</h2>
      <p>Kod kvara ili nezgode kolona staje zajedno, a Octavia odlučuje da li ostali nastavljaju. Brojevi su navedeni po sjećanju; potvrdite ih na stranicama BIHAMK-a i HAK-a.</p>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Služba</th><th>BiH</th><th>Hrvatska (plan B)</th></tr></thead>
        <tbody>
          <tr><td>Policija</td><td class="n">122</td><td class="n">192 / 112</td></tr>
          <tr><td>Hitna pomoć</td><td class="n">124</td><td class="n">194 / 112</td></tr>
          <tr><td>Vatrogasci</td><td class="n">123</td><td class="n">193 / 112</td></tr>
          <tr><td>Pomoć na cesti</td><td class="n">1282</td><td class="n">1987</td></tr>
          <tr><td>Vozači, restoran, smještaj</td><td colspan="2">Upisati brojeve prije puta</td></tr>
        </tbody>
      </table>
    </div>
    <div class="planb">
      <div><h3>Kvar jednog auta</h3><p>Putnici prelaze u druga dva auta (Audi prima još 3, ostali po 1). Vozač čeka pomoć na cesti s jednom osobom.</p></div>
      <div><h3>Zastoj na M17</h3><p>Javiti restoranu i skratiti doručak; polazak prema Neumu ostaje 11:45.</p></div>
      <div><h3>Cesta Stolac – Neum spora</h3><p>Prelazak na plan B: Čapljina – Doljani / Metković – Klek – Neum.</p></div>
      <div><h3>Fale dokumenti na planu B</h3><p>Taj auto ostaje na planu A preko Stoca.</p></div>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="flag" aria-hidden="true"></div>
    <p>Velika nagrada Neuma 2026. Sva vremena i udaljenosti su procjene; stanje na cestama provjerite kod BIHAMK-a na dan puta.</p>
  </div>
</footer>

<input type="file" accept="image/*" id="fileIn" hidden>

<script>
(function(){
  var store = {
    get:function(k){try{return localStorage.getItem('gpneum:'+k);}catch(e){return null;}},
    set:function(k,v){try{localStorage.setItem('gpneum:'+k,v);return true;}catch(e){return false;}},
    del:function(k){try{localStorage.removeItem('gpneum:'+k);}catch(e){}}
  };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* start lights */
  var lights = Array.prototype.slice.call(document.querySelectorAll('#lights .light'));
  var msg = document.getElementById('lightsMsg');
  var timers = [];
  function runLights(){
    timers.forEach(clearTimeout); timers = [];
    msg.classList.remove('go');
    msg.querySelector('.small').textContent = 'Svjetla se gase u';
    lights.forEach(function(l){l.classList.remove('on');});
    if(reduce){ msg.classList.add('go'); return; }
    lights.forEach(function(l,i){ timers.push(setTimeout(function(){l.classList.add('on');}, 500 + i*700)); });
    timers.push(setTimeout(function(){
      lights.forEach(function(l){l.classList.remove('on');});
      msg.querySelector('.small').textContent = 'Svjetla su se ugasila. Start:';
      msg.classList.add('go');
    }, 500 + 5*700 + 900));
  }
  document.getElementById('replay').addEventListener('click', runLights);
  runLights();

  /* podium: photos + names, shared, editable only by editors */
  var CAR = '<svg viewBox="0 0 320 200" aria-hidden="true"><path d="M30 138 C30 124 40 116 56 113 L96 106 L132 80 C142 73 152 70 166 70 L214 70 C228 70 238 75 248 84 L272 108 C284 110 294 118 294 132 L294 140 C294 146 290 150 284 150 L36 150 C32 150 30 146 30 140Z" fill="currentColor" opacity=".9"/><path d="M110 106 L138 86 C144 82 150 80 158 80 L178 80 L178 106Z M188 80 L212 80 C222 80 230 84 236 90 L252 106 L188 106Z" fill="#0B0E12" opacity=".55"/><circle cx="92" cy="150" r="20" fill="#0B0E12" opacity=".8"/><circle cx="92" cy="150" r="9" fill="currentColor"/><circle cx="234" cy="150" r="20" fill="#0B0E12" opacity=".8"/><circle cx="234" cy="150" r="9" fill="currentColor"/><path d="M20 172 L300 172" stroke="currentColor" stroke-width="2" opacity=".35"/></svg>';
  var FACE = '<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="currentColor" opacity=".10"/><path d="M20 64 C18 38 34 22 54 22 C72 22 84 36 84 54 L84 66 C84 72 80 76 74 76 L30 76 C24 76 20 71 20 64Z" fill="currentColor"/><path d="M46 46 L82 46 C83 50 84 54 84 58 L50 58 C46 58 44 55 44 52 C44 49 45 47 46 46Z" fill="#0B0E12" opacity=".85"/><path d="M24 66 L60 66" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/></svg>';
  var state = {photos:{}, names:{}}, editing = false, canEdit = false, db = null, assets = null;
  var slots = document.querySelectorAll('#podium .slot');
  var nameEls = document.querySelectorAll('#podium [data-name]');
  var statusEl = document.getElementById('editStatus');
  Array.prototype.forEach.call(nameEls, function(el){ el.dataset.def = el.textContent; });
  function status(t, err){ statusEl.textContent = t || ''; statusEl.classList.toggle('err', !!err); }
  function renderPodium(){
    Array.prototype.forEach.call(slots, function(s){
      var id = state.photos[s.dataset.slot], cueText = id ? 'Promijeni' : 'Dodaj sliku';
      var want = id ? 'img:'+id : 'ph';
      if(s.dataset.shown !== want){
        if(id){ s.innerHTML = '<img alt="">'; var im = s.querySelector('img'); im.alt = s.dataset.alt; im.src = '/_blob/' + id; im.onerror = function(){ s.innerHTML = (s.dataset.kind === 'car' ? CAR : FACE) + '<span class="cue"></span>'; s.querySelector('.cue').textContent = 'Dodaj sliku'; }; s.insertAdjacentHTML('beforeend','<span class="cue"></span>'); }
        else { s.innerHTML = (s.dataset.kind === 'car' ? CAR : FACE) + '<span class="cue"></span>'; }
        s.dataset.shown = want;
      }
      var c = s.querySelector('.cue'); if(c) c.textContent = cueText;
      s.disabled = !editing;
      s.setAttribute('aria-label', (id ? 'Promijeni sliku: ' : 'Dodaj sliku: ') + s.dataset.alt);
    });
    Array.prototype.forEach.call(nameEls, function(el){
      if(document.activeElement !== el) el.textContent = state.names[el.dataset.name] || el.dataset.def;
      try { el.contentEditable = editing ? 'plaintext-only' : 'false'; } catch(e){ el.contentEditable = editing ? 'true' : 'false'; }
    });
  }
  renderPodium();

  function save(){
    if(!db) return Promise.reject({code:'not_granted'});
    return db.doc('gallery/team').set({photos: state.photos, names: state.names});
  }
  function shrink(file, kind){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var c = document.createElement('canvas'), ctx;
        if(kind === 'face'){
          var m = Math.min(img.width, img.height), s = Math.min(480, m);
          c.width = s; c.height = s; ctx = c.getContext('2d');
          ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, s, s);
        } else {
          var w = Math.min(1600, img.width), h = Math.round(img.height * w / img.width);
          c.width = w; c.height = h; ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        }
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? res(b) : rej({code:'invalid_request'}); }, 'image/jpeg', .86);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej({code:'unsupported_type'}); };
      img.src = url;
    });
  }
  var MSG = {too_large:'Slika je prevelika.', unsupported_type:'Ovaj format slike nije podržan; probaj JPG ili PNG.', quota_or_state:'Prostor za slike je popunjen.', rate_limited:'Previše pokušaja; pričekaj malo pa probaj ponovo.', not_granted:'Nemaš pravo dodavanja slika na ovoj stranici.', upstream_auth:'Prijava je istekla; osvježi stranicu.'};
  var fileIn = document.getElementById('fileIn'), target = null;
  Array.prototype.forEach.call(slots, function(s){
    s.addEventListener('click', function(){ if(!editing || !assets) return; target = s; fileIn.value = ''; fileIn.click(); });
  });
  fileIn.addEventListener('change', function(){
    var f = fileIn.files && fileIn.files[0], s = target; if(!f || !s) return;
    s.classList.add('busy'); status('Učitavam sliku…');
    shrink(f, s.dataset.kind).then(function(b){ return assets.upload(b, {type:'image/jpeg'}); })
      .then(function(r){ state.photos[s.dataset.slot] = r.id; renderPodium(); return save(); })
      .then(function(){ status('Slika je sačuvana i vidljiva svima.'); })
      .catch(function(e){ status(MSG[e && e.code] || 'Slika nije sačuvana; probaj ponovo.', true); })
      .then(function(){ s.classList.remove('busy'); });
  });
  Array.prototype.forEach.call(nameEls, function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur', function(){
      if(!editing) return;
      var t = el.textContent.trim(), k = el.dataset.name;
      if(!t){ delete state.names[k]; el.textContent = el.dataset.def; }
      else if(t === el.dataset.def){ delete state.names[k]; }
      else state.names[k] = t;
      save().then(function(){ status('Ime je sačuvano.'); }).catch(function(){ status('Ime nije sačuvano; probaj ponovo.', true); });
    });
  });
  document.getElementById('editToggle').addEventListener('click', function(){
    editing = !editing;
    this.setAttribute('aria-pressed', String(editing));
    this.textContent = editing ? 'Završi uređivanje' : 'Uredi slike i imena';
    document.getElementById('podium').classList.toggle('editing', editing);
    status(editing ? 'Klikni na sliku da je dodaš ili promijeniš, a na ime da ga ispraviš.' : '');
    renderPodium();
  });

  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('db').then(function(d){
      if(!d) return;
      db = d;
      db.doc('gallery/team').onSnapshot(function(snap){
        var v = (snap && snap.exists && snap.data()) || {};
        state.photos = v.photos || {}; state.names = v.names || {};
        renderPodium();
      }, function(){});
    });
    Promise.all([window.claude.use('assets'), window.claude.use('user')]).then(function(r){
      assets = r[0]; var u = r[1];
      if(!assets || !u) return;
      return u.canEdit().then(function(ok){
        canEdit = !!ok;
        if(canEdit){ document.getElementById('editBar').hidden = false; document.getElementById('teamHint').textContent = 'Kao organizator vidiš dugme za uređivanje; ostali vide samo gotove slike i imena.'; }
      });
    }).catch(function(){});
  }
  /* plan switch */
  var rA = document.getElementById('routeA'), rB = document.getElementById('routeB');
  var bStops = [document.getElementById('stopCap'), document.getElementById('stopGr')];
  var stolac = document.getElementById('stopStolac');
  var btns = document.querySelectorAll('.plan-switch button');
  Array.prototype.forEach.call(btns, function(b){
    b.addEventListener('click', function(){
      var p = b.dataset.plan;
      Array.prototype.forEach.call(btns, function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      rA.classList.toggle('active', p === 'a'); rA.classList.toggle('dim', p === 'b');
      rB.classList.toggle('active', p === 'b');
      bStops.forEach(function(s){ s.classList.toggle('on', p === 'b'); });
      stolac.style.opacity = p === 'b' ? .5 : 1;
      document.querySelector('[data-sector="a"]').hidden = p !== 'a';
      document.querySelector('[data-sector="b"]').hidden = p !== 'b';
    });
  });

  /* checklist */
  var groups = document.querySelectorAll('.cgroup');
  function count(){
    Array.prototype.forEach.call(groups, function(g){
      var all = g.querySelectorAll('input'), done = g.querySelectorAll('input:checked').length;
      g.querySelector('[data-count]').textContent = done + '/' + all.length;
      g.querySelector('.meter i').style.width = (done/all.length*100) + '%';
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#checks input'), function(i){
    i.checked = store.get('chk:'+i.dataset.key) === '1';
    i.addEventListener('change', function(){ if(i.checked) store.set('chk:'+i.dataset.key,'1'); else store.del('chk:'+i.dataset.key); count(); });
  });
  document.getElementById('resetChecks').addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#checks input'), function(i){ i.checked = false; store.del('chk:'+i.dataset.key); });
    count();
  });
  count();
})();
</script>
</body>
</html>
